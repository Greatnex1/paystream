spring.application.name=bulk-transaction

server.port=6099
spring.r2dbc.username=postgres
spring.r2dbc.password=blesseduser
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/bulk-transaction
#spring.flyway.url=jdbc:postgresql://localhost:5432/bulk-transaction
spring.flyway.user=postgres
spring.flyway.password=blesseduser
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.platform=postgres
spring.sql.init.schema-locations=classpath:transaction.sql

spring.r2dbc.properties.schema=public


app.downstream.base-url= http://localhost:8081/api/v1
app.processing.concurrency=20
# ==========================
# === RESILIENCE4J RETRY ===
# ==========================

# Retry configuration for Transaction-Service
resilience4j.retry.instances.transactionServiceRetry.max-attempts=3
resilience4j.retry.instances.transactionServiceRetry.wait-duration=2s
resilience4j.retry.instances.transactionServiceRetry.exponential-backoff-multiplier=2
resilience4j.retry.instances.transactionServiceRetry.enable-exponential-backoff=true


# ====================================
# === RESILIENCE4J CIRCUIT BREAKER ===
# ====================================

# Circuit breaker configuration for Transaction-Service
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true

